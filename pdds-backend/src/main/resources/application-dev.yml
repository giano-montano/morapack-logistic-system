spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true  # ✅ ESTO FALTABA: Ejecuta data.sql DESPUÉS de crear las tablas

  sql:
    init:
      mode: always # Ejecuta data.sql siempre

  datasource:
    url: ${DB_URL}?createDatabaseIfNotExist=true # útil si te da flojera crear el schema
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    root: INFO
    pdds-backend: DEBUG
