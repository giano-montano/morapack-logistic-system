spring:
  application:
    name: pdds-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pdds_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:6910011718}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  output:
    ansi:
      enabled: ALWAYS

server:
  port: ${SERVER_PORT:8080}
